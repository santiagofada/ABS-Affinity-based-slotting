<style>
body { font-family: system-ui, sans-serif; margin: 16px; color: #222; }
h2 { margin: 0 0 12px 0; }
.controls { margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.controls select { font-size: 14px; padding: 4px 6px; }
.distance-box { font-weight: 600; padding: 6px 12px; background: #f0f0f0; border-radius: 4px; }
svg.warehouse { border: 1px solid #ccc; background: white; width: 100%; height: auto; max-height: 80vh; }
.walking-graph { stroke: #d8d8d8; stroke-width: 4.8; stroke-linecap: round; }
.bay { stroke: #222; stroke-width: 1; cursor: pointer; }
.bay-odd { fill: #1f77b4; }
.bay-even { fill: #ff7f0e; }
.bay:hover { stroke-width: 3; }
.bay.sel-from { fill: #2ca02c !important; stroke-width: 3; }
.bay.sel-to { fill: #d62728 !important; stroke-width: 3; }
.dock { fill: red; stroke: #222; stroke-width: 1; cursor: pointer; }
.dock:hover { stroke-width: 3; }
.dock.sel-from, .dock.sel-to { stroke-width: 4; stroke: #2ca02c; }
.dock.sel-to { stroke: #d62728; }
#tooltip {
  position: absolute; pointer-events: none; background: rgba(0,0,0,0.85); color: white;
  padding: 4px 8px; border-radius: 3px; font-size: 12px; display: none; white-space: nowrap;
  z-index: 10;
}
.legend { font-size: 12px; color: #666; margin-top: 8px; }
.legend .swatch { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; border: 1px solid #999; }
</style>

function distanceBetween(a, b) {
  if (a === b) return 0;
  const key = a < b ? a + "|" + b : b + "|" + a;
  return DISTANCES[key];
}

function setSelection() {
  document.querySelectorAll('.sel-from, .sel-to').forEach(el => {
    el.classList.remove('sel-from', 'sel-to');
  });
  const from = document.getElementById('sel-from').value;
  const to = document.getElementById('sel-to').value;
  document.querySelector(`[data-id="${CSS.escape(from)}"]`)?.classList.add('sel-from');
  document.querySelector(`[data-id="${CSS.escape(to)}"]`)?.classList.add('sel-to');
  const d = distanceBetween(from, to);
  document.getElementById('dist-val').textContent = d != null ? d.toFixed(0) + ' in' : '—';
}

document.getElementById('sel-from').addEventListener('change', setSelection);
document.getElementById('sel-to').addEventListener('change', setSelection);
document.getElementById('sel-from').value = "DOCK";
document.getElementById('sel-to').value = "A01-01";

const tooltip = document.getElementById('tooltip');
let toggle = 0;
document.querySelectorAll('[data-info]').forEach(el => {
  el.addEventListener('mouseenter', e => {
    tooltip.textContent = e.currentTarget.getAttribute('data-info');
    tooltip.style.display = 'block';
  });
  el.addEventListener('mousemove', e => {
    tooltip.style.left = (e.pageX + 12) + 'px';
    tooltip.style.top = (e.pageY + 12) + 'px';
  });
  el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  el.addEventListener('click', e => {
    const id = e.currentTarget.getAttribute('data-id');
    const which = toggle % 2 === 0 ? 'sel-from' : 'sel-to';
    document.getElementById(which).value = id;
    toggle++;
    setSelection();
  });
});

setSelection();
